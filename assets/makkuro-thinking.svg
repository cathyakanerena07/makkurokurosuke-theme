<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs><style>
    * { transform-box: view-box; }
    .breathe { transform-origin: 7.5px 14.5px; animation: breathe 3.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.02,0.98); } }
    .blink { transform-origin: 7.5px 5.8px; animation: blink 4.2s infinite; }
    @keyframes blink {
      0%, 40%, 100% { transform: scaleY(1); }
      43% { transform: scaleY(0.06); }
      46% { transform: scaleY(1); }
      52% { transform: scaleY(1); }
      55% { transform: scaleY(0.06); }
      58% { transform: scaleY(1); }
    }
    .tilt { transform-origin: 7.5px 14.5px; animation: tilt 3.6s ease-in-out infinite; }
    @keyframes tilt { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    .puff { transform-origin: 18px -5px; animation: puff 3s ease-in-out infinite; }
    @keyframes puff { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-0.5px) scale(1.03); } }
    .tail-a { animation: tail 3s ease-in-out infinite; }
    .tail-b { animation: tail 3s ease-in-out infinite 0.25s; }
    @keyframes tail { 0%,100% { transform: translateY(0); opacity: .75; } 50% { transform: translateY(-0.5px); opacity: 1; } }
    .dot { animation: dot 1.5s ease-in-out infinite; }
    .dot-2 { animation-delay: 0.25s; }
    .dot-3 { animation-delay: 0.5s; }
    @keyframes dot { 0%,70%,100% { opacity: 0.25; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-0.35px); } }
  </style></defs>
<g id="shadow-js"><ellipse cx="7.5" cy="15.9" rx="5.6" ry="1" fill="#000" opacity="0.16"/></g>
  <g class="tilt">
    <g class="breathe">
      <circle cx="7.5" cy="6.5" r="8" fill="#EF6DA3"/>
      <g class="blink"><g transform="rotate(14 5.4 5.3)"><rect x="4.45" y="3.68" width="1.9" height="3.23" rx="0.95" fill="#ffffff"/></g><g transform="rotate(14 9.6 5.3)"><rect x="8.65" y="3.68" width="1.9" height="3.23" rx="0.95" fill="#ffffff"/></g></g>
    </g>
  </g>
  <circle class="tail-a" cx="12.6" cy="0.6" r="1.15" fill="#ffffff" stroke="#101010" stroke-width="0.5"/><circle class="tail-b" cx="11.2" cy="3.0" r="0.75" fill="#ffffff" stroke="#101010" stroke-width="0.5"/><g class="puff"><circle cx="18" cy="-5.6" r="3.3" fill="#ffffff" stroke="#101010" stroke-width="0.5"/><circle cx="14.6" cy="-3.9" r="2.3" fill="#ffffff" stroke="#101010" stroke-width="0.5"/><circle cx="21.2" cy="-3.8" r="2.4" fill="#ffffff" stroke="#101010" stroke-width="0.5"/><circle cx="19.4" cy="-7.9" r="2.2" fill="#ffffff" stroke="#101010" stroke-width="0.5"/><circle cx="18" cy="-5.6" r="3.05" fill="#ffffff"/><circle cx="14.6" cy="-3.9" r="2.05" fill="#ffffff"/><circle cx="21.2" cy="-3.8" r="2.15" fill="#ffffff"/><circle cx="19.4" cy="-7.9" r="1.95" fill="#ffffff"/><circle class="dot" cx="16.4" cy="-5.2" r="0.62" fill="#101010"/><circle class="dot dot-2" cx="18.2" cy="-5.2" r="0.62" fill="#101010"/><circle class="dot dot-3" cx="20" cy="-5.2" r="0.62" fill="#101010"/></g>
</svg>
