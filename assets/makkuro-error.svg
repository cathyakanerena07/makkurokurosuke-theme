<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs><style>
    * { transform-box: view-box; }
    .slump { transform-origin: 7.5px 14.5px; animation: slump 2.4s ease-in-out infinite; }
    @keyframes slump { 0%,100% { transform: rotate(-3deg) scale(1,1); } 50% { transform: rotate(-3deg) scale(1.02,0.97); } }
    .plate { transform-origin: 21px 4px; animation: plate 2.4s ease-in-out infinite; }
    @keyframes plate { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    .drop { animation: drop 2.2s ease-in-out infinite; }
    @keyframes drop { 0% { transform: translateY(-1px); opacity: 0; } 35% { opacity: 1; } 100% { transform: translateY(3.5px); opacity: 0; } }
  </style></defs>
<g id="shadow-js"><ellipse cx="7.5" cy="15.9" rx="5.4" ry="1" fill="#000" opacity="0.13"/></g>
  <g class="slump">
    <circle cx="7.5" cy="6.5" r="8" fill="#101010"/>
    <path d="M3.9 4.3 L6.9 7.3 M6.9 4.3 L3.9 7.3" stroke="#ffffff" stroke-width="0.62" stroke-linecap="round"/><path d="M8.1 4.3 L11.1 7.3 M11.1 4.3 L8.1 7.3" stroke="#ffffff" stroke-width="0.62" stroke-linecap="round"/>
  </g>
  <g class="plate">
    <rect x="14.6" y="-2.2" width="13.6" height="6.2" rx="0.9" fill="#ffffff" stroke="#101010" stroke-width="0.55"/>
    <text x="21.4" y="1.7" font-family="Helvetica, Arial, sans-serif" font-size="3.0" font-weight="700" fill="#e5484d" text-anchor="middle">ERROR</text>
    <path d="M16.0 4.0 L16.0 9.5" stroke="#101010" stroke-width="0.55" stroke-linecap="round"/>
  </g>
  <g class="drop"><path d="M-1.0 2.0 c1.5 1.9 1.5 2.7 0 3.3 c-1.5 -0.6 -1.5 -1.4 0 -3.3 Z" fill="#7fc7e8"/></g>
</svg>
