<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs><style>
    * { transform-box: view-box; }
    .breathe { transform-origin: 7.5px 14.5px; animation: breathe 3.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.02,0.98); } }
    .hop { transform-origin: 7.5px 14.5px; animation: hop 0.85s ease-in-out infinite; }
    @keyframes hop { 0%,100% { transform: translateY(0) scale(1,1); } 45% { transform: translateY(-1.8px) scale(0.97,1.03); } }
    .bulb { transform-origin: 7.5px -7px; animation: glow 1.4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: 0.75; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.04); } }
    .spark-a { transform-origin: -2.2px -2.2px; animation: twinkle 1.8s ease-in-out infinite; }
    .spark-b { transform-origin: 17.2px -1.4px; animation: twinkle 1.8s ease-in-out infinite 0.9s; }
    @keyframes twinkle { 0%,100% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }
  </style></defs>
<g id="shadow-js"><ellipse cx="7.5" cy="15.9" rx="5.2" ry="1" fill="#000" opacity="0.16"/></g>
  <g class="hop"><g class="breathe"><circle cx="7.5" cy="6.5" r="8" fill="#EF6DA3"/><path d="M3.7 6.6 Q5.4 4.4 7.1 6.6" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round"/><path d="M7.9 6.6 Q9.6 4.4 11.3 6.6" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round"/></g></g>
  <g class="bulb">
    <circle cx="7.5" cy="-7.6" r="2.5" fill="#ffcf4a" stroke="#101010" stroke-width="0.5"/>
    <path d="M6.35 -5.3 h2.3 M6.65 -4.4 h1.7" stroke="#101010" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M6.6 -8.4 q0.9 1.1 0 2.1 M8.4 -8.4 q-0.9 1.1 0 2.1" stroke="#101010" stroke-width="0.4" fill="none" opacity="0.5"/>
    <g stroke="#101010" stroke-width="0.5" stroke-linecap="round">
      <path d="M3.1 -9.6 l-1.2 -1.0"/>
      <path d="M11.9 -9.6 l1.2 -1.0"/>
      <path d="M7.5 -11.2 v-1.4"/>
    </g>
  </g>
  <g class="spark-a"><path d="M0 -1.27 Q0.26 -0.26 1.27 0 Q0.26 0.26 0 1.27 Q-0.26 0.26 -1.27 0 Q-0.26 -0.26 0 -1.27 Z" fill="#101010" transform="translate(-2.2 -2.2)"/></g>
  <g class="spark-b"><path d="M0 -1.27 Q0.26 -0.26 1.27 0 Q0.26 0.26 0 1.27 Q-0.26 0.26 -1.27 0 Q-0.26 -0.26 0 -1.27 Z" fill="#101010" transform="translate(17.2 -1.4)"/></g>
</svg>
